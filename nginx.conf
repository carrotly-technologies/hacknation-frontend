server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # RODO / TLS (hacknation-backend docs/rodo/dpia.md): TLS 1.2+ terminates at the proxy in front
  # (Coolify); HSTS keeps browsers on HTTPS. Repeated in every location below, because an
  # add_header there replaces the ones inherited from this level.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Hashed build assets can be cached forever.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # SPA fallback: unknown paths serve index.html so client-side routes survive a refresh.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
