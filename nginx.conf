# nginx template: the image's entrypoint fills in ${CSP_CONNECT_SRC} (Dockerfile: the API address,
# from the VITE_API_URL build arg) and writes /etc/nginx/conf.d/default.conf at container start.
# Only CSP_* variables are substituted (NGINX_ENVSUBST_FILTER), so nginx's own $uri etc. stay as they are.

# Hashed build assets can be cached forever; everything else is revalidated.
map $uri $kompas_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Relative redirects: behind a TLS proxy an absolute one would point at http:// and the container port.
  absolute_redirect off;

  # Security headers (OWASP ASVS V14.4), on every answer. The locations below add no headers of their
  # own: one add_header there would drop all of these (nginx does not merge them).
  # No inline scripts or styles: scripts, styles and fonts come from this server only; the API is the
  # only other address the app talks to.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # RODO / TLS (hacknation-backend docs/rodo/dpia.md): TLS 1.2+ terminates at the proxy in front (Coolify);
  # HSTS keeps browsers on HTTPS. Ignored by browsers over plain http (an intranet without TLS).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $kompas_cache_control always;

  location /assets/ {
    try_files $uri =404;
  }

  # SPA fallback: unknown paths serve index.html so client-side routes survive a refresh. No `$uri/`:
  # /prezentacja is both a route and a folder of screenshots (public/prezentacja), and a directory match
  # answered a redirect to http://…/prezentacja/ and then 403 instead of the page.
  location / {
    try_files $uri /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
